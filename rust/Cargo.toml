[workspace]
members = ["crates/vela-core", "crates/vela-player", "crates/vela-desktop"]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
quick-xml = "0.38"
regex = "1"
flate2 = "1"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
libloading = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
